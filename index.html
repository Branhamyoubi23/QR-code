<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <p>Enter your text or URL</p>
        <input type="text" placeholder="Text or URL" id="qrtext">
        <div id="imgbox">
            <img src="" id="qrimage" width="300" alt="Generated QR code">
        </div>
        <button onclick="generateqr()">Generate QR code</button>
        <button id="downloadqr" class="download-btn" onclick="downloadqrImage()">Download QR code</button>
    </div>
    <script>
        const qrimage = document.getElementById("qrimage");
        const qrtext = document.getElementById("qrtext");
        const downloadqr = document.getElementById("downloadqr");
        let generatedQrUrl = "";

        function generateqr() {
            const qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" + encodeURIComponent(qrtext.value);

            generatedQrUrl = qrUrl;
            qrimage.src = qrUrl;
            downloadqr.classList.add("show");
        }

        async function downloadqrImage() {
            if (!generatedQrUrl) {
                return;
            }

            const response = await fetch(generatedQrUrl);
            const blob = await response.blob();
            const downloadUrl = URL.createObjectURL(blob);
            const link = document.createElement("a");

            link.href = downloadUrl;
            link.download = "qr-code.png";
            link.click();
            URL.revokeObjectURL(downloadUrl);
        }
    </script>
</body>
</html>
